name: regulatory-readiness

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rre
      POSTGRES_PASSWORD: rre
      POSTGRES_DB: rre_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rre -d rre_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs,ses
      DEBUG: '0'
      AWS_DEFAULT_REGION: eu-west-1
    ports:
      - '4566:4566'
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3 ls && awslocal sqs list-queues']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
