name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rre
          POSTGRES_PASSWORD: rre
          POSTGRES_DB: rre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rre -d rre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://rre:rre@localhost:5432/rre_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Marketing copy guard
        run: pnpm lint:copy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Formatting
        run: pnpm format:check

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
