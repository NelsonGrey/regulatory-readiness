name: Marketing site

on:
  push:
    branches: [staging, main]
    paths:
      - 'apps/marketing/**'
      - 'packages/brand/**'
      - 'packages/copy-guard/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/marketing.yml'
  pull_request:
    paths:
      - 'apps/marketing/**'
      - 'packages/brand/**'
      - 'packages/copy-guard/**'

jobs:
  verify-marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rre/marketing lint
      - run: pnpm --filter @rre/marketing lint:copy
      - run: pnpm --filter @rre/marketing build
      - name: Accessibility smoke test
        run: |
          pnpm --filter @rre/marketing preview --host 127.0.0.1 &
          pnpm --filter @rre/marketing exec wait-on http://127.0.0.1:4321
          pnpm --filter @rre/marketing test:a11y
      - name: Lighthouse budgets
        run: pnpm --filter @rre/marketing test:lighthouse

  deploy:
    if: github.event_name == 'push' && vars.MARKETING_DEPLOY_ENABLED == 'true'
    needs: verify-marketing
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rre/marketing build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_SCHEDULER_URL: ${{ vars.PUBLIC_SCHEDULER_URL }}
          PUBLIC_ANALYTICS_DOMAIN: ${{ vars.PUBLIC_ANALYTICS_DOMAIN }}
          PUBLIC_ANALYTICS_SRC: ${{ vars.PUBLIC_ANALYTICS_SRC }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Publish hashed assets
        run: aws s3 sync apps/marketing/dist/_astro s3://${{ vars.MARKETING_BUCKET }}/_astro --delete --cache-control 'public,max-age=31536000,immutable'
      - name: Publish site documents
        run: aws s3 sync apps/marketing/dist s3://${{ vars.MARKETING_BUCKET }} --delete --exclude '_astro/*' --cache-control 'public,max-age=300,must-revalidate'
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id '${{ vars.CLOUDFRONT_DIST_ID }}' --paths '/*'
